<body class="light-theme">
    <!-- Component placeholders -->
    <div id="header"></div>
    <div id="hero"></div>
    <div id="about"></div>
    <div id="experience"></div>
    <div id="education"></div>
    <div id="projects"></div>
    <div id="certifications"></div>
    <div id="skills"></div>
    <div id="contact"></div>
    <div id="modalContainer"></div>
    <div id="footer"></div>

    <!-- JavaScript -->
    <script src="js/template-engine.js"></script>
    <script src="js/main.js"></script>    
    <script>
        // Wait for DOM content to be loaded
        document.addEventListener('DOMContentLoaded', async () => {
            // Load all components
            await Promise.all([
                templateEngine.insertComponent('#header', 'components/header.html'),
                templateEngine.insertComponent('#hero', 'components/hero.html'),
                templateEngine.insertComponent('#about', 'components/about.html'),
                templateEngine.insertComponent('#experience', 'components/experience.html'),
                templateEngine.insertComponent('#education', 'components/education.html'),
                templateEngine.insertComponent('#projects', 'projects/projects.html'),
                templateEngine.insertComponent('#certifications', 'components/certifications.html'),
                templateEngine.insertComponent('#skills', 'components/skills.html'),
                templateEngine.insertComponent('#contact', 'components/contact.html'),
                templateEngine.insertComponent('#footer', 'components/footer.html'),
                templateEngine.insertComponent('#modalContainer', 'components/modal.html'),
            ]);

            // Initialize the site after components are loaded
            if (window.initSite) {
                window.initSite();
            }

            const savedScroll = sessionStorage.getItem('scrollY');
            if (savedScroll !== null) {
                requestAnimationFrame(() => {
                    window.scrollTo(0, parseInt(savedScroll, 10));
                    sessionStorage.removeItem('scrollY');
                });
            }

            // ⬇️ SCROLL BACK TO PROJECTS IF RETURNING FROM PROJECT PAGE
            if (sessionStorage.getItem('returnToProjects')) {
                const tryScroll = () => {
                    const projects = document.getElementById('projects');
                    if (projects) {
                        projects.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        sessionStorage.removeItem('returnToProjects');
                    } else {
                        requestAnimationFrame(tryScroll);
                    }
                };
                tryScroll();
            }

        });
    </script>
</body>
