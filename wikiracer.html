<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WikiRacer | Evangelos Bangoudis</title>

  <!-- Google Font (optional, same as B-Tree page) -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Open Sans', Arial, sans-serif;
      background: #f3f7fa;
      color: #222;
    }

    /* HEADER (same style as other pages) */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 3rem 1.2rem 6rem;
      z-index: 1000;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    #logo {
      font-size: 2rem;
      font-weight: bold;
      color: #ffcc00;
    }

    nav {
      display: flex;
      gap: 1.2rem;
      margin-right: 9rem;
    }

    nav a {
      text-decoration: none;
      font-weight: 600;
      color: #000;
    }

    nav a:hover {
      color: #d12d2d;
    }

    /* BACK BUTTON */
    .back-btn {
      position: absolute;
      top: 95px;
      left: 30px;
      background: #0a66c2;
      color: white;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      cursor: pointer;
      transition: 0.25s ease;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    }

    .back-btn:hover {
      transform: scale(1.12);
    }

    .back-btn:hover::after {
      content: " Back";
      position: absolute;
      left: 60px;
      font-size: 1rem;
      font-weight: 600;
      color: #0a66c2;
      background: white;
      padding: 4px 10px;
      border-radius: 6px;
      border: 2px solid #0a66c2;
      white-space: nowrap;
    }

    /* MAIN CONTENT */
    .content {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding-top: 120px; /* space for header */
      box-sizing: border-box;
    }

    h1 {
      font-size: 2.6rem;
      margin-bottom: 0.3rem;
    }

    .divider {
      position: relative;
      width: 140px;
      height: 2px;
      background: #d12d2d;
      margin: 15px auto 25px auto;
      border-radius: 5px;
    }

    .divider::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      background: #d12d2d;
      border-radius: 50%;
    }

    .status-card {
      background: white;
      padding: 32px 40px;
      max-width: 600px;
      margin: 0 auto;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    .status-icon {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .status-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .status-text {
      font-size: 1rem;
      color: #555;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div id="logo">EB</div>
    <nav>
      <a href="index.html#home">Home</a>
      <a href="index.html#about">About</a>
      <a href="mailto:evangelos@bangoudis.com">Contact</a>
    </nav>
  </header>

  <!-- BACK BUTTON -->
  <div class="back-btn" onclick="location.href='index.html'">←</div>

  <!-- MAIN CONTENT -->
  <div class="content">
    <h1>WikiRacer</h1>
    <div class="divider"></div>

    <div class="status-card">
      <div class="status-icon">🚧</div>
      <div class="status-title">Under Construction</div>
      <p class="status-text">
        This page is currently under construction.<br>
        I’m working on documenting the WikiRacer project here.<br><br>
        In the meantime, you can go back to the homepage and explore other projects.
      </p>
    </div>
  </div>

</body>
</html>
