<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WikiRacer | Evangelos Bangoudis</title>

  <style>
    body {
      margin: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #f3f7fa;
      color: #222;
    }

    /* HEADER — same as homepage */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.2rem 3rem 1.2rem 6rem;
      z-index: 1000;
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    #logo {
      font-size: 2rem;
      font-weight: bold;
      color: #ffcc00;
    }

    nav {
      display: flex;
      gap: 1.2rem;
      margin-right: 9rem;
    }

    nav a {
      text-decoration: none;
      font-weight: 600;
      color: #000;
    }

    nav a:hover {
      color: #d12d2d;
    }

    /* BACK BUTTON */
    .back-btn {
      position: absolute;
      top: 95px;
      left: 30px;
      background: #0a66c2;
      color: white;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      cursor: pointer;
      transition: 0.25s ease;
    }

    .back-btn:hover {
      transform: scale(1.12);
    }

    .back-btn:hover::after {
      content: " Back";
      position: absolute;
      left: 60px;
      font-size: 1rem;
      font-weight: 600;
      color: #0a66c2;
      background: white;
      padding: 4px 10px;
      border-radius: 6px;
      border: 2px solid #0a66c2;
    }

    /* MAIN CONTENT */
    .content {
      padding-top: 140px;
      text-align: center;
      max-width: 900px;
      margin: auto;
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 0.5rem;
    }

    /* TAGS */
    .tag-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.7rem;
      margin-top: 1rem;
      margin-bottom: 2rem;
    }

    .tag {
      background: #0a66c2;
      color: white;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    /* DIVIDER */
    .divider {
      position: relative;
      width: 140px;
      height: 2px;
      background: #d12d2d;
      margin: 18px auto;
      border-radius: 5px;
    }

    .divider::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      background: #d12d2d;
      border-radius: 50%;
    }

    /* TEXT */
    .description {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #444;
      text-align: center;
      max-width: 800px;
      margin: auto;
    }

    /* IMAGE */
    .project-image {
      display: block;
      margin: 2.5rem auto;
      width: 70%;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>
    <div id="logo">EB</div>
